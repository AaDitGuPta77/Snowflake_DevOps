name: Snowflake Governance CI-CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
  workflow_dispatch:

jobs:
  deploy-to-snowflake:
    runs-on: ubuntu-latest
    environment: snf-verification

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install snowflake-connector-python cryptography

      - name: Execute Deployment and Validate Data
        env:
          SNF_ACCOUNT: ${{ secrets.SNF_ACCOUNT }}
          SNF_USER: ${{ secrets.SNF_USER }}
          SNF_PRIVATE_KEY: ${{ secrets.SNF_PRIVATE_KEY }}
          SNF_WAREHOUSE: ${{ secrets.SNF_WAREHOUSE }}
          SNF_DATABASE: ${{ secrets.SNF_DATABASE }}
          SNF_SCHEMA: ${{ secrets.SNF_SCHEMA }}
          SNF_ROLE: ${{ secrets.SNF_ROLE }}
        run: python deploy.py

      - name: Step 8 Alert on Failure
        if: failure()
        run: echo "Deployment failed during script execution or validation."

      - name: Step 10 Notify Success
        if: success()
        run: echo "Deployment and validation completed successfully."
