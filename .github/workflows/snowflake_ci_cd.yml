name: Snowflake Governance CI-CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
  workflow_dispatch:

jobs:
  deploy-to-snowflake:
    runs-on: ubuntu-latest
    # Steps 4, 5, 6: Dashboard pause waiting for both head approvals
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install snowflake-connector-python cryptography

      # Steps 7 & 9: Execute scripts in sequence and run data validation
      - name: Execute Deployment & Validate Data
        env:
          SNF_ACCOUNT: ${{ secrets.SNF_ACCOUNT }}
          SNF_USER: ${{ secrets.SNF_USER }}
          SNF_PRIVATE_KEY: ${{ secrets.SNF_PRIVATE_KEY }}
          SNF_WAREHOUSE: ${{ secrets.SNF_WAREHOUSE }}
          SNF_DATABASE: ${{ secrets.SNF_DATABASE }}
          SNF_SCHEMA: ${{ secrets.SNF_SCHEMA }}
          SNF_ROLE: ${{ secrets.SNF_ROLE }}
        run: python deploy.py

      # Step 8: Error alert sent to developer if deployment or validation fails
      - name: Step 8: Alert Email to Dev (On Failure)
        if: failure()
        run: |
          echo "::error::Deployment run failed. An alert has been dispatched with error details."
          echo "Developer action required: Inspect logs, fix scripts, and redeploy."

      # Step 10: Final success notification and request closure
      - name: Step 10: Email Developer: Deployed (Close Request)
        if: success()
        run: |
          echo "Deployment and data validation completed successfully."
          echo "Notification sent to developer. Change request closed."